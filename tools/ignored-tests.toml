# Every ignored test (`#[ignore]`) in the workspace, each with its group, and the outside programs it
# runs (cycle plan WP-11, V-10). tools/check-ignored-tests.py, in CI's lint job, fails when an ignored
# test isn't here, is here twice, or is here but no longer ignored: a new ignored test is given a
# group here. tools/run-cross-checks.sh runs group G6 by these exact names; docs/developer/testing.md
# records when each group last ran.
#
# name:   the test's name as `cargo test -- --list --ignored` gives it
# crate:  its package
# target: its test target, as cargo selects it (--lib, --bin NAME or --test NAME)
# file:   the file it's in
# group:  one of [groups] below
# needs:  the outside programs it runs

[groups]
G1 = "The renderer's limits: what hayro doesn't draw yet. Run by name at every hayro upgrade and at release preparation; each passes once hayro draws it."
G2 = "Child processes: each started by a test that runs by default, in a process of its own (a timeout, a time zone, a stack size, a stand-in CUPS). Run on every CI run through that test."
G3 = "Fetched samples: tests reading samples that aren't committed (tools/fetch-render-samples.sh, or dss/ fetched by hand). Run at release preparation."
G4 = "Timings: measurements in a release build, for performance.md. Run at release preparation; not pass or fail."
G5 = "CUPS: tests needing a running CUPS. Run by hand on a machine with CUPS at release preparation; recorded as not run until then."
G6 = "Cross-checks: Poppler, Ghostscript and OpenSSL read what LimarePDF wrote. Run on every CI run, in the cross-check job."

