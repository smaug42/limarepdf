name: packages
# The apt and dnf repositories on GitHub Pages (https://smaug42.github.io/mpe/), rebuilt
# from the .deb and .rpm files of the last three published releases each time a release
# is published. Started by hand, it builds the site without deploying it (unless "deploy"
# is ticked); before the first release with packages it takes them from the latest
# release dry run of ci.yml on the chosen branch.
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      deploy:
        description: Deploy the site to GitHub Pages
        type: boolean
        default: false

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v4
      - name: Fetch the packages
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir in
          for tag in $(gh release list --exclude-drafts --exclude-pre-releases --limit 3 \
              --json tagName --jq '.[].tagName'); do
            gh release download "$tag" --pattern '*.deb' --pattern '*.rpm' --dir in || true
          done
          if ! ls in/*.deb > /dev/null 2>&1; then
            run=$(gh run list --workflow ci.yml --branch "$GITHUB_REF_NAME" --event workflow_dispatch \
              --status success --limit 1 --json databaseId --jq '.[0].databaseId')
            gh run download "$run" --name release-dry-run --dir dry
            cp dry/*.deb dry/*.rpm in/
          fi
          ls -l in
      - name: Build the repositories
        env:
          GPG_SIGNING_KEY: ${{ secrets.GPG_SIGNING_KEY }}
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
        run: |
          sudo apt-get install -y apt-utils createrepo-c > /dev/null
          echo "$GPG_SIGNING_KEY" | gpg --batch --import
          bash packaging/build-repos.sh in site
          # Check the signatures against the published key, as apt and dnf will.
          gpg --dearmor < docs/mpe-signing-key.asc > "$RUNNER_TEMP/mpe.gpg"
          gpgv --keyring "$RUNNER_TEMP/mpe.gpg" site/apt/InRelease
          gpgv --keyring "$RUNNER_TEMP/mpe.gpg" site/rpm/repodata/repomd.xml.asc site/rpm/repodata/repomd.xml
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site

  deploy:
    needs: build
    if: github.event_name == 'release' || inputs.deploy
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
