name: ci
on: [push, pull_request, workflow_dispatch]

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest,  name: linux-x86_64 }
          - { os: windows-latest, name: windows-x86_64 }
          - { os: macos-latest,   name: macos-arm64 }
          - { os: macos-15-intel, name: macos-x86_64 }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Test
        run: cargo test --workspace --release
      - name: Build
        run: cargo build --workspace --release
      - name: Package
        shell: bash
        run: |
          mkdir -p dist
          ext=""; [ "${{ runner.os }}" = "Windows" ] && ext=".exe"
          cp target/release/mpe$ext target/release/mpe-gui$ext dist/
          cp README.md LICENSE-MIT LICENSE-APACHE dist/
          # Attribution and licence for the OCR model built into the binaries.
          cp crates/mpe-core/models/README.md dist/OCR-MODEL.md
          # Licence for the Inter font built into mpe-gui.
          cp crates/mpe-gui/assets/fonts/OFL.txt dist/FONT-LICENSE-Inter.txt
      - uses: actions/upload-artifact@v4
        with:
          name: mpe-${{ matrix.name }}
          path: dist
