[package]
name = "mpe-core"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
lopdf.workspace = true
hayro.workspace = true
anyhow.workspace = true
thiserror.workspace = true
rayon.workspace = true
rand.workspace = true
image.workspace = true
tiff.workspace = true
fax = "0.2"
png = "0.18"
ocrs = { version = "0.13", default-features = false, features = ["rten"] }
rten = { version = "0.26", default-features = false, features = ["rten_format"] }
rten-imageproc = "0.26"

# Printing through the Windows print spooler and GDI (system DLLs; no C code is built).
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_Graphics_Printing",
    "Win32_Storage_Xps",
] }
