name: ci
# Pull requests, main, and version tags; a branch push without a pull request does not
# run CI (start one by hand with workflow_dispatch).
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

# A newer commit on the same branch or pull request cancels the older run. Tag runs are
# never cancelled, since they make the release.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest,  name: linux-x86_64 }
          - { os: windows-latest, name: windows-x86_64 }
          - { os: macos-latest,   name: macos-arm64 }
          - { os: macos-15-intel, name: macos-x86_64 }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Test
        run: cargo test --workspace --release
      - name: Build
        run: cargo build --workspace --release
      # One archive per platform, made here because artifacts lose Unix file permissions:
      # a folder mpe-<version>-<platform> holding the binaries, the docs and the licences.
      - name: Package
        shell: bash
        run: |
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          name="mpe-$version-${{ matrix.name }}"
          dir="dist/$name"
          mkdir -p "$dir"
          ext=""; [ "${{ runner.os }}" = "Windows" ] && ext=".exe"
          cp target/release/mpe$ext target/release/mpe-gui$ext "$dir/"
          cp README.md CHANGELOG.md LICENSE-MIT LICENSE-APACHE "$dir/"
          # The README links to docs/, so the docs travel with each version.
          cp -r docs "$dir/docs"
          # Attribution and licence for the OCR model built into the binaries.
          cp crates/mpe-core/models/README.md "$dir/OCR-MODEL.md"
          # Licence for the Inter font built into mpe-gui.
          cp crates/mpe-gui/assets/fonts/OFL.txt "$dir/FONT-LICENSE-Inter.txt"
          cd dist
          if [ "${{ runner.os }}" = "Windows" ]; then
            7z a -tzip "$name.zip" "$name" > /dev/null
          else
            tar -czf "$name.tar.gz" "$name"
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: mpe-${{ matrix.name }}
          path: |
            dist/*.tar.gz
            dist/*.zip

  # On a version tag (v0.3.0): a draft GitHub Release with the four archives, their
  # checksums and this version's section of CHANGELOG.md. Publish it on GitHub.
  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: assets
          merge-multiple: true
      - name: Draft the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="$GITHUB_REF_NAME"
          version="${tag#v}"
          if ! grep -q "^version = \"$version\"" Cargo.toml; then
            echo "Tag $tag does not match the version in Cargo.toml"; exit 1
          fi
          awk -v v="[$version]" '/^## /{p = index($0, v) > 0; next} p' CHANGELOG.md > notes.md
          if [ ! -s notes.md ]; then
            echo "CHANGELOG.md has no section for $version"; exit 1
          fi
          # Relative links do not work on the release page: point them at this tag.
          sed -i "s#](docs/#](https://github.com/$GITHUB_REPOSITORY/blob/$tag/docs/#g" notes.md
          (cd assets && sha256sum * > SHA256SUMS)
          gh release create "$tag" --draft --verify-tag --title "MPE $version" \
            --notes-file notes.md assets/*
