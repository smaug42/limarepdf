name: fuzz
# Each fuzz target (fuzz/README.md) for five minutes, weekly and by hand. Never required: a
# failure is looked at, its input is kept as the run's artifact, and it becomes a test in the
# crate it concerns, written to fail first.
on:
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fuzz:
    strategy:
      fail-fast: false
      matrix:
        target: [open, content, draw, readers, images, verify, signature, trustfiles, pkcs12, ipp]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@2c76c034f9e32a5d6e2c104dc4df23a22476db04 # nightly
      # A set version, as cargo-deny's in ci.yml.
      - name: Install cargo-fuzz
        run: cargo install cargo-fuzz --locked --version 0.13.2
      - name: Seed
        run: sh fuzz/seed.sh
      - name: Fuzz
        run: >
          cargo fuzz run ${{ matrix.target }} --
          -max_total_time=300 -rss_limit_mb=2048 -timeout=20 -max_len=262144
      - name: Keep the failing input
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fuzz-${{ matrix.target }}
          path: fuzz/artifacts/${{ matrix.target }}/
          if-no-files-found: ignore
