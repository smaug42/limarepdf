[package]
name = "limarepdf-core"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
lopdf.workspace = true
hayro.workspace = true
anyhow.workspace = true
thiserror.workspace = true
rayon.workspace = true
image.workspace = true
tiff.workspace = true
fax = "0.3"
# Checking Flate data in full before hidden layers are removed (sanitise.rs); lopdf and hayro
# already use it. The pure-Rust zlib-rs backend, as hayro has it, so no C zlib is used.
flate2 = { version = "1.1.10", default-features = false, features = ["zlib-rs"] }
png = "0.18"
# Glyph outlines for typed signatures; hayro already uses it to draw fonts.
skrifa = "0.46"
# Installed fonts, for fonts a PDF names but doesn't embed (installed_fonts.rs).
fontdb = "0.24"
# Fonts embedded in PDFs for text beyond Western European and in installed fonts (embed.rs):
# cut down to the glyphs used. `variable-fonts` sets a variable font at the chosen weight; it
# brings `write-fonts` and its own `skrifa` and `read-fonts` versions.
subsetter = "0.2.6"
# Accents typed as separate marks put together (NFC) before text is embedded; lopdf already
# uses it.
unicode-normalization = "0.1.25"
# Emoji made of several characters (skin tones, flags, families) refused whole (embed.rs);
# egui already uses it.
unicode-segmentation = "1.13"
# Shaping new text in installed fonts and Liberation (layout.rs): kerning, standard ligatures
# and marks placed as the font places them. It reads fonts through the `read-fonts` version
# `skrifa` uses, so core keeps one font reader.
harfrust = "0.13.3"
# Where lines may break, by Unicode's line-breaking rule (UAX #14), for every wrapper
# (layout.rs).
unicode-linebreak = "0.1.5"
# Each character's script, so text is given fonts and shaped by script (layout.rs).
unicode-script = "0.5.8"
ocrs = { version = "0.13", default-features = false, features = ["rten"] }
rten = { version = "0.26", default-features = false, features = ["rten_format"] }
rten-imageproc = "0.26"

# Digital signatures (docs/developer/architecture.md lists these crates and their release status).
# `rsa` and `pkcs1` are pre-releases, pinned exactly.
chrono = { version = "0.4", default-features = false, features = ["std", "clock"] }
der = { version = "0.8.2", features = ["alloc", "oid", "pem"] }
spki = "0.8.1"
x509-cert = { version = "0.3.0", default-features = false, features = ["std", "builder"] }
rsa = { version = "=0.10.0-rc.19", features = ["sha2"] }
pkcs1 = { version = "=0.8.0-rc.5", default-features = false }
p256 = { version = "0.14.0", features = ["ecdsa", "pkcs8"] }
p384 = { version = "0.14.0", features = ["ecdsa", "pkcs8"] }
sha1 = { version = "0.11.0", features = ["oid"] }
sha2 = { version = "0.11.0", features = ["oid"] }
# Digital IDs: keys, and PKCS#12 files read and written by LimarePDF itself (ids.rs, pkcs12.rs).
getrandom = { version = "0.4", features = ["sys_rng"] }
pbkdf2 = { version = "0.13.0", default-features = false, features = ["hmac"] }
hmac = "0.13.0"
aes = "0.9"
cbc = { version = "0.2.1", features = ["alloc", "block-padding"] }
des = "0.9.0"
rc2 = "0.9.0"
zeroize = "1.9"
subtle = "2.6"

# The bundled Liberation fonts stored compressed (build.rs); the same crate as above.
[build-dependencies]
flate2 = { version = "1.1.10", default-features = false, features = ["zlib-rs"] }

# Printing through the Windows print spooler and GDI (system DLLs; no C code is built), and
# a disk's free space for crash recovery copies (disk.rs).
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_Graphics_Printing",
    "Win32_Storage_FileSystem",
    "Win32_Storage_Xps",
] }

# A disk's free space and this user's id, for crash recovery copies (disk.rs). Already in the
# Linux build through the windowing crates; new to the macOS build.
[target.'cfg(unix)'.dependencies]
rustix = { version = "1", features = ["fs", "process", "std"] }
