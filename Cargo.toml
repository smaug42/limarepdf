[workspace]
resolver = "2"
members = ["crates/limarepdf-core", "crates/limarepdf-cli", "crates/limarepdf-gui"]

[workspace.package]
version = "0.9.0"
edition = "2021"
license = "MIT OR Apache-2.0"
rust-version = "1.95"

[workspace.dependencies]
lopdf = "0.45"
hayro = { version = "0.8", features = ["embed-fonts"] }
anyhow = "1"
thiserror = "2"
rayon = "1"
rand = "0.9"
clap = { version = "4", features = ["derive"] }
eframe = "0.36"
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
tiff = "0.11"
egui-phosphor = { version = "0.14", features = ["regular", "fill"] }
rfd = "0.17"
serde_json = "1"

# OCR inference is about 100x slower unoptimised; optimise these even in debug builds.
[profile.dev.package.ocrs]
opt-level = 3
[profile.dev.package.rten]
opt-level = 3
[profile.dev.package.rten-base]
opt-level = 3
[profile.dev.package.rten-gemm]
opt-level = 3
[profile.dev.package.rten-imageproc]
opt-level = 3
[profile.dev.package.rten-simd]
opt-level = 3
[profile.dev.package.rten-tensor]
opt-level = 3
[profile.dev.package.rten-vecmath]
opt-level = 3
# Signature checks and the tests that sign: RSA is very slow unoptimised.
[profile.dev.package.crypto-bigint]
opt-level = 3
[profile.dev.package.rsa]
opt-level = 3
[profile.dev.package.p256]
opt-level = 3
[profile.dev.package.p384]
opt-level = 3
[profile.dev.package.primeorder]
opt-level = 3
[profile.dev.package.sha2]
opt-level = 3
# Digital IDs: password stretching runs millions of hash rounds, and the generic hashing
# and encryption code is compiled into limarepdf-core itself, so limarepdf-core is optimised too
# (level 2 is the lowest that inlines it; reading an ID otherwise takes seconds).
[profile.dev.package.limarepdf-core]
opt-level = 2
[profile.dev.package.sha1]
opt-level = 3
[profile.dev.package.aes]
opt-level = 3
[profile.dev.package.des]
opt-level = 3
[profile.dev.package.rc2]
opt-level = 3

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = true
# Integer overflow stops with an error instead of silently wrapping; the app catches it on open, edit and save.
overflow-checks = true

# CI's tests: optimised with overflow checks, as released, but without link-time optimisation in one
# codegen unit, which every test executable would otherwise go through on its own (most of an hour on
# the slower runners). The binaries CI packages are still built with `--release`.
[profile.ci-test]
inherits = "release"
lto = false
codegen-units = 16
strip = false
