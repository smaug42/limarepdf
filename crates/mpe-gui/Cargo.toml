[package]
name = "mpe-gui"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "PDF viewer and editor"
homepage = "https://github.com/smaug42/mpe"
repository = "https://github.com/smaug42/mpe"

[[bin]]
name = "mpe-gui"
path = "src/main.rs"

[dependencies]
mpe-core = { path = "../mpe-core" }
anyhow.workspace = true
eframe.workspace = true
rayon.workspace = true
rfd.workspace = true
egui-phosphor.workspace = true

[build-dependencies]
# Embeds the icon in mpe-gui.exe on Windows; does nothing on other platforms.
winresource = { version = "0.1.34", default-features = false }

[dev-dependencies]
# Tests build documents with form fields; already used by mpe-core.
lopdf.workspace = true

# Linux packages, built in CI with cargo-deb and cargo-generate-rpm after the release build.
# Both hold mpe-gui and the mpe command, the desktop entry, the icon and the docs. The
# libraries listed are the ones mpe-gui loads at run time (windowing, OpenGL, file dialogs
# over D-Bus), which the tools can't see; printing uses lp and file dialogs use the portal.
[package.metadata.deb]
name = "mpe"
maintainer = "Clayton Cornell <clayton@smaug42.com>"
copyright = "Clayton Cornell"
extended-description = """\
MPE organises, edits, annotates, fills in, stamps, secures, scans and prints PDFs, from a \
desktop app (mpe-gui) or the command line (mpe). Written entirely in Rust."""
section = "graphics"
depends = "$auto, libdbus-1-3, libegl1, libwayland-client0, libwayland-egl1, libx11-6, libx11-xcb1, libxcursor1, libxi6, libxkbcommon0, libxkbcommon-x11-0"
recommends = "xdg-desktop-portal, cups-client"
assets = [
    ["target/release/mpe-gui", "usr/bin/", "755"],
    ["target/release/mpe", "usr/bin/", "755"],
    ["assets/mpe.desktop", "usr/share/applications/", "644"],
    ["../../docs/images/icon.png", "usr/share/icons/hicolor/256x256/apps/mpe.png", "644"],
    ["../../README.md", "usr/share/doc/mpe/", "644"],
    ["../../CHANGELOG.md", "usr/share/doc/mpe/", "644"],
    ["../../LICENSE-MIT", "usr/share/doc/mpe/", "644"],
    ["../../LICENSE-APACHE", "usr/share/doc/mpe/", "644"],
    ["../mpe-core/models/README.md", "usr/share/doc/mpe/OCR-MODEL.md", "644"],
    ["assets/fonts/OFL.txt", "usr/share/doc/mpe/FONT-LICENSE-Inter.txt", "644"],
    ["../mpe-core/assets/fonts/OFL-DancingScript.txt", "usr/share/doc/mpe/FONT-LICENSE-DancingScript.txt", "644"],
    ["../mpe-core/assets/fonts/OFL-GreatVibes.txt", "usr/share/doc/mpe/FONT-LICENSE-GreatVibes.txt", "644"],
]

[package.metadata.generate-rpm]
name = "mpe"
summary = "PDF viewer and editor"
url = "https://github.com/smaug42/mpe"
# The built-in scan adds "[WEAK]" glibc entries nothing provides, so dnf refuses the
# package; the requirements below are complete instead.
auto-req = "no"
assets = [
    { source = "target/release/mpe-gui", dest = "/usr/bin/mpe-gui", mode = "755" },
    { source = "target/release/mpe", dest = "/usr/bin/mpe", mode = "755" },
    { source = "assets/mpe.desktop", dest = "/usr/share/applications/mpe.desktop", mode = "644" },
    { source = "../../docs/images/icon.png", dest = "/usr/share/icons/hicolor/256x256/apps/mpe.png", mode = "644" },
    { source = "../../README.md", dest = "/usr/share/doc/mpe/README.md", mode = "644", doc = true },
    { source = "../../CHANGELOG.md", dest = "/usr/share/doc/mpe/CHANGELOG.md", mode = "644", doc = true },
    { source = "../../LICENSE-MIT", dest = "/usr/share/licenses/mpe/LICENSE-MIT", mode = "644" },
    { source = "../../LICENSE-APACHE", dest = "/usr/share/licenses/mpe/LICENSE-APACHE", mode = "644" },
    { source = "../mpe-core/models/README.md", dest = "/usr/share/doc/mpe/OCR-MODEL.md", mode = "644", doc = true },
    { source = "assets/fonts/OFL.txt", dest = "/usr/share/licenses/mpe/FONT-LICENSE-Inter.txt", mode = "644" },
    { source = "../mpe-core/assets/fonts/OFL-DancingScript.txt", dest = "/usr/share/licenses/mpe/FONT-LICENSE-DancingScript.txt", mode = "644" },
    { source = "../mpe-core/assets/fonts/OFL-GreatVibes.txt", dest = "/usr/share/licenses/mpe/FONT-LICENSE-GreatVibes.txt", mode = "644" },
]

# Library sonames rather than package names, so the same rpm works on Fedora and openSUSE.
[package.metadata.generate-rpm.requires]
"libc.so.6()(64bit)" = "*"
"libm.so.6()(64bit)" = "*"
"libgcc_s.so.1()(64bit)" = "*"
"libdbus-1.so.3()(64bit)" = "*"
"libEGL.so.1()(64bit)" = "*"
"libwayland-client.so.0()(64bit)" = "*"
"libwayland-egl.so.1()(64bit)" = "*"
"libX11.so.6()(64bit)" = "*"
"libX11-xcb.so.1()(64bit)" = "*"
"libXcursor.so.1()(64bit)" = "*"
"libXi.so.6()(64bit)" = "*"
"libxkbcommon.so.0()(64bit)" = "*"
"libxkbcommon-x11.so.0()(64bit)" = "*"

[package.metadata.generate-rpm.recommends]
xdg-desktop-portal = "*"
cups-client = "*"
