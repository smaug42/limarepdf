name: ci
# Pull requests, main, and version tags; a branch push without a pull request does not
# run CI (start one by hand with workflow_dispatch).
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
    inputs:
      dry_run:
        description: Sign and attest the files as a release would, without making a release
        type: boolean
        default: false

# A newer commit on the same branch or pull request cancels the older run. Tag runs are
# never cancelled, since they make the release.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

# Read-only by default; the release job asks for what it needs to publish.
permissions:
  contents: read

# The oldest macOS the Mac builds run on, for both kinds of Mac, as docs/install.md and
# packaging/macos/Info.plist say (Rust's own default for Intel is older). The dmg job checks it.
env:
  MACOSX_DEPLOYMENT_TARGET: "11.0"

jobs:
  # Known security advisories (RustSec) against every crate in Cargo.lock. Ignored, with
  # the reason in docs/signatures.md: RUSTSEC-2023-0071, an RSA timing leak in `rsa` with
  # no fixed version, which needs someone timing many signings on the signer's machine.
  # The release job waits for it: a release never ships with a known advisory.
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - name: cargo audit
        run: |
          cargo install cargo-audit --locked
          cargo audit --ignore RUSTSEC-2023-0071

  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest,  name: linux-x86_64 }
          - { os: windows-latest, name: windows-x86_64 }
          - { os: macos-latest,   name: macos-arm64 }
          - { os: macos-15-intel, name: macos-x86_64 }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # Optimised as released, without link-time optimisation (Cargo.toml's ci-test profile).
      # --locked here and below: built from Cargo.lock exactly, the versions the audit job
      # checked, failing if it is out of date rather than updating it.
      - name: Test
        run: cargo test --workspace --profile ci-test --locked
      - name: Build
        run: cargo build --workspace --release --locked
      # One archive per platform, made here because artifacts lose Unix file permissions:
      # a folder limarepdf-<version>-<platform> holding the binaries, the docs and the licences.
      - name: Package
        shell: bash
        run: |
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          name="limarepdf-$version-${{ matrix.name }}"
          dir="dist/$name"
          mkdir -p "$dir"
          ext=""; [ "${{ runner.os }}" = "Windows" ] && ext=".exe"
          cp target/release/limarepdf-cli$ext target/release/limarepdf$ext "$dir/"
          cp README.md CHANGELOG.md SECURITY.md LICENSE-MIT LICENSE-APACHE "$dir/"
          # The README links to docs/, so the docs travel with each version.
          cp -r docs "$dir/docs"
          # Attribution and licence for the OCR model built into the binaries.
          cp crates/limarepdf-core/models/README.md "$dir/OCR-MODEL.md"
          # Licence for the Inter font built into limarepdf.
          cp crates/limarepdf-gui/assets/fonts/OFL.txt "$dir/FONT-LICENSE-Inter.txt"
          # Licences for the fonts built into limarepdf-core: Liberation (text typed on the
          # page, and embedded in PDFs) and the handwriting fonts (typed signatures).
          for f in OFL-Liberation OFL-Caveat OFL-CedarvilleCursive LICENSE-HomemadeApple OFL-Zeyada; do
            cp "crates/limarepdf-core/assets/fonts/$f.txt" "$dir/FONT-LICENSE-${f#*-}.txt"
          done
          # Linux desktop entry and icon; docs/install.md says where they go.
          if [ "${{ runner.os }}" = "Linux" ]; then
            cp crates/limarepdf-gui/assets/io.github.smaug42.limarepdf.desktop "$dir/"
            cp docs/images/icon.png "$dir/io.github.smaug42.limarepdf.png"
          fi
          # Every file it should hold there, and every link in its docs working.
          py=python3; [ "${{ runner.os }}" = "Windows" ] && py=python
          $py packaging/check-package.py "$dir"
          cd dist
          if [ "${{ runner.os }}" = "Windows" ]; then
            7z a -tzip "$name.zip" "$name" > /dev/null
          else
            tar -czf "$name.tar.gz" "$name"
          fi
      # .deb and .rpm from the binaries just built; the settings are in crates/limarepdf-gui/Cargo.toml.
      # The rpm is signed later, in the release job, which holds the key.
      - name: Linux packages
        if: runner.os == 'Linux'
        run: |
          cargo install cargo-deb cargo-generate-rpm --locked
          bash packaging/package-docs.sh
          cargo deb -p limarepdf-gui --no-build --no-strip --output dist/
          cargo generate-rpm -p crates/limarepdf-gui --output dist/
      # Each package's files as installed, and the glibc it asks for: the rpm names it by hand
      # (Cargo.toml), so it must match what the binaries use; the deb's is worked out by cargo-deb.
      - name: Check the Linux packages
        if: runner.os == 'Linux'
        run: |
          sudo apt-get install -y rpm > /dev/null
          dpkg-deb -c dist/*.deb
          rpm -qlp dist/*.rpm
          mkdir -p "$RUNNER_TEMP/deb" "$RUNNER_TEMP/rpm"
          dpkg-deb -x dist/*.deb "$RUNNER_TEMP/deb"
          python3 packaging/check-package.py "$RUNNER_TEMP/deb"
          rpm2cpio "$PWD"/dist/*.rpm | (cd "$RUNNER_TEMP/rpm" && cpio -idm --quiet)
          python3 packaging/check-package.py "$RUNNER_TEMP/rpm"
          need=$(objdump -T target/release/limarepdf target/release/limarepdf-cli \
            | grep -o 'GLIBC_[0-9][0-9.]*' | sort -uV | tail -1)
          asked=$(rpm -qp --requires dist/*.rpm | sed -n 's/^libc\.so\.6(\(GLIBC_[0-9.]*\))(64bit).*/\1/p')
          echo "The binaries need $need; the rpm asks for $asked; the deb: $(dpkg-deb -f dist/*.deb Depends | grep -o 'libc6 ([^)]*)')"
          if [ "$need" != "$asked" ]; then
            echo "Set the rpm's GLIBC_ requirement in crates/limarepdf-gui/Cargo.toml to $need"; exit 1
          fi
      # The MSI from packaging/windows/limarepdf.wxs. WiX is pinned to 5 (open source, no EULA step).
      # Two later versions of it, for the upgrade checks below, go to the runner's temporary folder.
      - name: Windows installer
        if: runner.os == 'Windows'
        shell: bash
        run: |
          dotnet tool install --global wix --version 5.0.2
          export PATH="$PATH:$HOME/.dotnet/tools"
          wix extension add --global WixToolset.UI.wixext/5.0.2
          bash packaging/package-docs.sh
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          build() {
            wix build packaging/windows/limarepdf.wxs -arch x64 -ext WixToolset.UI.wixext \
              -loc packaging/windows/limarepdf.wxl -culture en-US -d Version=$1 -o "$2"
          }
          build "$version" "dist/limarepdf-$version-x86_64.msi"
          build 255.0.0 "$RUNNER_TEMP/upgrade-1.msi"
          build 255.0.1 "$RUNNER_TEMP/upgrade-2.msi"
      # Installs the MSI without its screens, as a silent install would: the files and Start menu
      # shortcut, and the desktop shortcut option left out, asked for, kept by an upgrade and turned
      # off by one; then uninstalls. The screens themselves are checked by hand (docs/developer/testing.md).
      - name: Check the Windows installer
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $msi = (Get-Item dist\*.msi).FullName
          $folder = "$env:ProgramFiles\LimarePDF"
          $menu = "$env:ProgramData\Microsoft\Windows\Start Menu\Programs\LimarePDF.lnk"
          $desktop = "$env:PUBLIC\Desktop\LimarePDF.lnk"
          $log = "$env:RUNNER_TEMP\msiexec.log"
          function Run($what) {
            Write-Output "msiexec $what"
            $p = Start-Process msiexec -ArgumentList "$what /qn /l*v `"$log`"" -Wait -PassThru
            if ($p.ExitCode -notin 0, 3010) {
              Get-Content $log -Tail 80
              throw "msiexec $what ended with $($p.ExitCode)"
            }
          }
          function Expect($path, $there) {
            if ((Test-Path $path) -ne $there) { throw "$path is $(if ($there) { 'missing' } else { 'still there' })" }
          }
          Run "/i `"$msi`""
          Expect "$folder\limarepdf.exe" $true; Expect $menu $true; Expect $desktop $false
          python packaging\check-package.py $folder
          if ($LASTEXITCODE -ne 0) { throw "The installed folder has problems" }
          Run "/x `"$msi`""
          Expect $folder $false; Expect $menu $false
          Run "/i `"$msi`" DESKTOPSHORTCUT=1"
          Expect $desktop $true
          Run "/i `"$env:RUNNER_TEMP\upgrade-1.msi`""
          Expect $desktop $true
          Run "/i `"$env:RUNNER_TEMP\upgrade-2.msi`" DESKTOPSHORTCUT=0"
          Expect $desktop $false; Expect $menu $true
          Run "/x `"$env:RUNNER_TEMP\upgrade-2.msi`""
          Expect $folder $false; Expect $menu $false; Expect $desktop $false
      - uses: actions/upload-artifact@v7
        with:
          name: limarepdf-${{ matrix.name }}
          path: |
            dist/*.tar.gz
            dist/*.zip
            dist/*.deb
            dist/*.rpm
            dist/*.msi

  # A universal LimarePDF.app (Apple Silicon and Intel) in a .dmg; packaging/macos/make-dmg.sh.
  # The tests ran in the build job on both Macs.
  macos-dmg:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin, x86_64-apple-darwin
      - uses: Swatinem/rust-cache@v2
      - name: Build
        run: cargo build --workspace --release --locked --target aarch64-apple-darwin --target x86_64-apple-darwin
      - name: Make the dmg
        run: bash packaging/macos/make-dmg.sh dist
      # The app as it comes out of the dmg: its files and their links, and macOS 11 as the oldest
      # system for both kinds of Mac.
      - name: Check the dmg
        run: |
          hdiutil attach -nobrowse -readonly -mountpoint "$RUNNER_TEMP/dmg" dist/*.dmg
          app="$RUNNER_TEMP/dmg/LimarePDF.app"
          find "$app" -type f
          python3 packaging/check-package.py "$app/Contents"
          for bin in limarepdf limarepdf-cli; do
            for arch in arm64 x86_64; do
              minos=$(otool -arch $arch -l "$app/Contents/MacOS/$bin" | awk '/minos/ {print $2; exit}')
              echo "$bin ($arch): macOS $minos or later"
              [ "$minos" = "11.0" ] || exit 1
            done
          done
          hdiutil detach "$RUNNER_TEMP/dmg"
      - uses: actions/upload-artifact@v7
        with:
          name: limarepdf-macos-dmg
          path: dist/*.dmg

  # On a version tag (v0.3.0): a draft GitHub Release with the archives, their checksums,
  # GPG signatures, build attestations and this version's section of CHANGELOG.md.
  # Publish it on GitHub. A dry run (workflow_dispatch) does everything but the release
  # and uploads the signed files as an artifact instead. Both wait for the audit job, so
  # neither starts after a known advisory.
  release:
    needs: [audit, build, macos-dmg]
    if: startsWith(github.ref, 'refs/tags/v') || inputs.dry_run
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v7
        with:
          # All tags, to find the previous release for the compare link.
          fetch-depth: 0
      - uses: actions/download-artifact@v8
        with:
          path: assets
          merge-multiple: true
      # SHA256SUMS, then a detached signature (.asc) for it and for every file, made with
      # the signing subkey in secrets and checked against the published key in docs/.
      - name: Checksums and signatures
        env:
          GPG_SIGNING_KEY: ${{ secrets.GPG_SIGNING_KEY }}
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
        run: |
          if [ -z "$GPG_SIGNING_KEY" ]; then
            echo "The GPG_SIGNING_KEY secret is not set"; exit 1
          fi
          echo "$GPG_SIGNING_KEY" | gpg --batch --import
          gpg --dearmor < docs/limarepdf-signing-key.asc > "$RUNNER_TEMP/limarepdf.gpg"
          # The rpm carries its own signature, checked by rpm and dnf against the published key.
          sudo apt-get install -y rpm > /dev/null
          (umask 077; printf '%s' "$GPG_PASSPHRASE" > "$RUNNER_TEMP/pass")
          key=$(gpg --list-secret-keys --with-colons | awk -F: '/^fpr/ {print $10; exit}')
          # Ubuntu's rpm looks for gpg2, which isn't installed.
          rpmsign --addsign --define "__gpg /usr/bin/gpg" --define "_gpg_name $key" \
            --define "_gpg_sign_cmd_extra_args --batch --pinentry-mode loopback --passphrase-file $RUNNER_TEMP/pass" \
            assets/*.rpm
          rm "$RUNNER_TEMP/pass"
          rpmkeys --dbpath "$RUNNER_TEMP/rpmdb" --import docs/limarepdf-signing-key.asc
          rpmkeys --dbpath "$RUNNER_TEMP/rpmdb" --checksig assets/*.rpm | tee "$RUNNER_TEMP/rpmcheck"
          grep -q "signatures OK" "$RUNNER_TEMP/rpmcheck"
          cd assets
          sha256sum * > SHA256SUMS
          for f in *; do
            gpg --batch --pinentry-mode loopback --passphrase "$GPG_PASSPHRASE" \
              --armor --detach-sign "$f"
            gpgv --keyring "$RUNNER_TEMP/limarepdf.gpg" "$f.asc" "$f"
          done
      - uses: actions/attest-build-provenance@v4
        with:
          subject-path: assets/*
      - name: Upload the dry run
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        uses: actions/upload-artifact@v7
        with:
          name: release-dry-run
          path: assets
      - name: Draft the release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="$GITHUB_REF_NAME"
          version="${tag#v}"
          if ! grep -q "^version = \"$version\"" Cargo.toml; then
            echo "Tag $tag does not match the version in Cargo.toml"; exit 1
          fi
          awk -v v="[$version]" '/^## /{p = index($0, v) > 0; next} p' CHANGELOG.md > notes.md
          if [ ! -s notes.md ]; then
            echo "CHANGELOG.md has no section for $version"; exit 1
          fi
          # Relative links do not work on the release page: point them at this tag.
          sed -i "s#](docs/#](https://github.com/$GITHUB_REPOSITORY/blob/$tag/docs/#g" notes.md
          # Link every commit since the previous version tag, if there is one.
          prev=$(git tag --list 'v*' --sort=-v:refname | awk -v t="$tag" 'f {print; exit} $0 == t {f = 1}')
          if [ -n "$prev" ]; then
            printf '\n**All changes:** https://github.com/%s/compare/%s...%s\n' \
              "$GITHUB_REPOSITORY" "$prev" "$tag" >> notes.md
          fi
          gh release create "$tag" --draft --verify-tag --title "LimarePDF $version" \
            --notes-file notes.md assets/*
