# cargo-about's settings for THIRD-PARTY-LICENSES.html, the licences and notices of the crates built into the
# programs: packaging/package-notices.sh writes it, packaging/check-package.py checks it in every package. The
# licences are the crates' own, as they state them; this is not a legal verdict.
#
# The licences accepted are deny.toml's allow list (package-notices.sh stops if they differ). A crate offering a
# choice is listed under the first here it offers: MIT before Apache-2.0, as MIT's text has the copyright line.
accepted = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "0BSD",
    "BSD-1-Clause",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "ISC",
    "MPL-2.0",
    "OFL-1.1",
    "Ubuntu-font-1.0",
    "Unicode-3.0",
    "Unlicense",
    "Zlib",
]
# Only the crates built into the programs; the workspace's own (publish = false) are LimarePDF.
ignore-build-dependencies = true
ignore-dev-dependencies = true
private = { ignore = true }

# Works a crate bundles that cargo-about doesn't find by itself. Each file is pinned by its SHA-256: when a new
# version of the crate changes it, cargo-about only warns and leaves the notice out, so package-notices.sh stops
# on the warning. Read the new file, then update the licence and the sum (docs/developer/releasing.md).

# Foxit's fonts for the standard PDF fonts (the embed-fonts feature), with their BSD-3-Clause notice.
[hayro-font.clarify]
license = "(Apache-2.0 OR MIT) AND BSD-3-Clause"
[[hayro-font.clarify.files]]
path = "LICENSE-MIT"
license = "MIT"
checksum = "51b50e6120c344dcc146bbd6375ca1c78e079d97c8bea76e67a53d6ff0efebac"
[[hayro-font.clarify.files]]
path = "LICENSE-APACHE"
license = "Apache-2.0"
checksum = "0cec06e0e55fbc3dc5cee4fca9b607f66cb8f4e4dbcf3b3c013594dd156732e9"
[[hayro-font.clarify.files]]
