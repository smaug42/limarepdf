# The Windows programs carry the C runtime, so they don't need the Visual C++ runtime's DLLs, which Windows doesn't
# have (#324); packaging/check-package.py fails on a program importing them. RUSTFLAGS, when set, replaces these.
[target.x86_64-pc-windows-msvc]
rustflags = ["-C", "target-feature=+crt-static"]

[target.aarch64-pc-windows-msvc]
rustflags = ["-C", "target-feature=+crt-static"]
