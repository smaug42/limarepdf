[package]
name = "mpe-gui"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "mpe-gui"
path = "src/main.rs"

[dependencies]
mpe-core = { path = "../mpe-core" }
anyhow.workspace = true
eframe.workspace = true
rayon.workspace = true
rfd.workspace = true
egui-phosphor.workspace = true

[build-dependencies]
# Embeds the icon in mpe-gui.exe on Windows; does nothing on other platforms.
winresource = { version = "0.1.34", default-features = false }

[dev-dependencies]
# Tests build documents with form fields; already used by mpe-core.
lopdf.workspace = true
