name: ci
# Pull requests, main, and version tags; a branch push without a pull request does not
# run CI (start one by hand with workflow_dispatch).
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
    inputs:
      dry_run:
        description: Build the release files and rehearse signing them, without signing, attesting or making a release
        type: boolean
        default: false

# A newer commit on the same branch or pull request cancels the older run. Tag runs are
# never cancelled, since they make the release.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

# Read-only by default; the release job asks for what it needs to publish.
permissions:
  contents: read

# The oldest macOS the Mac builds run on, for both kinds of Mac, as docs/install.md and
# packaging/macos/Info.plist say (Rust's own default for Intel is older). The dmg job checks it.
env:
  MACOSX_DEPLOYMENT_TARGET: "11.0"

jobs:
  # cargo deny (deny.toml) against every crate in Cargo.lock, for every platform: known
  # security advisories (RustSec), licences, crates.io as the only source, duplicate versions
  # (reported only). The advisories set aside are in deny.toml, each with its reason. The
  # release job waits for it: a release never ships with a known advisory. fuzz/Cargo.lock,
  # the fuzz targets' own workspace (never shipped), is checked against the same file.
  deny:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          toolchain: stable
      # A set version, so a new cargo-deny can't change the check unseen; releasing.md says
      # when to move it.
      - name: Install cargo-deny
        run: cargo install cargo-deny --locked --version 0.22.1
      - name: cargo deny
        run: cargo deny --locked check
      - name: cargo deny on fuzz/
        run: cargo deny --manifest-path fuzz/Cargo.toml --config deny.toml --locked check

  # Formatting, and clippy with warnings refused, on every target (tests and examples too),
  # for the code of all three platforms. Clippy checks without linking, so one Linux runner
  # covers Windows (the GNU target: LimarePDF's code has no cfg on the toolchain kind) and the
  # Macs (one target: no cfg on the architecture), without waiting for scarce Mac runners.
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          toolchain: stable
          components: clippy, rustfmt
          targets: x86_64-pc-windows-gnu, aarch64-apple-darwin
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      # No tracked code reading from a build folder and no audit scratch tracked; the docs'
      # relative links and anchors; the signing secrets only in release-signing jobs that no pull
      # request starts; every ignored test listed once in tools/ignored-tests.toml, with its
      # group. Each tool's self-test first, so a broken tool can't pass. The package check's
      # self-test is here too; the packages themselves are checked where they're built. So is the
      # OCR measure's, which needs scans and a release build to run. compare-cli.sh's test stands
      # in for Cargo and both CLIs, so nothing is built.
      - name: Repository checks
        run: |
          python3 -I tools/check-scratch.py --self-test
          python3 -I tools/check-scratch.py
          python3 -I tools/check-doc-links.py --self-test
          python3 -I tools/check-doc-links.py
          python3 -I tools/check-workflows.py --self-test
          python3 -I tools/check-workflows.py
          python3 -I tools/check-ignored-tests.py --self-test
          python3 -I tools/check-ignored-tests.py
          python3 -I packaging/check-package.py --self-test
          python3 -I tools/ocr-accuracy.py --self-test
          bash crates/limarepdf-core/tools/test-compare-cli.sh
      - name: Formatting
        run: cargo fmt --all --check
      # Each platform in turn, all of them reported even when one fails.
      - name: Clippy
        run: |
          failed=""
          for target in x86_64-unknown-linux-gnu x86_64-pc-windows-gnu aarch64-apple-darwin; do
            echo "::group::clippy $target"
            cargo clippy --workspace --all-targets --locked --target "$target" -- -D warnings \
              || failed="$failed $target"
            echo "::endgroup::"
          done
          if [ -n "$failed" ]; then
            echo "::error::clippy found problems on:$failed"; exit 1
          fi

  # The cross-checks, group G6 of tools/ignored-tests.toml: Poppler, Ghostscript and OpenSSL
  # read what LimarePDF wrote. tools/run-cross-checks.sh fails when one of them is missing, and
  # when the tests that ran and passed aren't exactly the list's.
  cross-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: Install Poppler, Ghostscript and OpenSSL
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends poppler-utils ghostscript openssl
      - name: Cross-checks
        run: bash tools/run-cross-checks.sh

  # The fuzz targets (fuzz/, a workspace of their own) still build, checked with the cfg
  # `cargo fuzz` sets, on stable and without libFuzzer's sanitizers; fuzz.yml runs them weekly.
  fuzz-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: fuzz
      - name: Check the fuzz targets
        env:
          RUSTFLAGS: --cfg fuzzing -D warnings
        run: cargo check --manifest-path fuzz/Cargo.toml --locked --bins

  # Each build is native, on a runner of its architecture; `target` is what its packages are
  # checked against (packaging/check-package.py), so programs an emulated toolchain builds for
  # the runner's other architecture can't ship.
  # Linux is built on Ubuntu 24.04, not ubuntu-latest: the binaries need the glibc they were
  # built against, and 24.04's, 2.39, is the floor docs/install.md names.
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-24.04,     name: linux-x86_64,   target: x86_64-unknown-linux-gnu }
          - { os: ubuntu-24.04-arm, name: linux-arm64,    target: aarch64-unknown-linux-gnu }
          - { os: windows-latest,   name: windows-x86_64, target: x86_64-pc-windows-msvc }
          - { os: windows-11-arm,   name: windows-arm64,  target: aarch64-pc-windows-msvc }
          - { os: macos-latest,     name: macos-arm64,    target: aarch64-apple-darwin }
          - { os: macos-15-intel,   name: macos-x86_64,   target: x86_64-apple-darwin }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      # Optimised as released, without link-time optimisation (Cargo.toml's ci-test profile).
      # --locked here and below: built from Cargo.lock exactly, the versions the deny job
      # checked, failing if it is out of date rather than updating it.
      - name: Test
        run: cargo test --workspace --profile ci-test --locked
      - name: Build
        run: cargo build --workspace --release --locked
      # Core's test seam (REL-10, the `test-seams` feature) is for tests only: the programs
      # released must not have it. Its variable's name is in every program built with it.
      - name: No test seam
        shell: bash
        run: |
          ext=""; [ "${{ runner.os }}" = "Windows" ] && ext=".exe"
          for bin in limarepdf limarepdf-cli; do
            if grep -q LIMAREPDF_TEST_SYNC_FAILS "target/release/$bin$ext"; then
              echo "::error::target/release/$bin$ext was built with the test seam"; exit 1
            fi
          done
      # For the crates' licences in every package (packaging/package-notices.sh, which checks it
      # is this version). A set version, as for cargo-deny; releasing.md says when to move it.
      - name: Install cargo-about
        run: cargo install cargo-about --locked --version 0.9.3 --features cli
      # One archive per platform, made here because artifacts lose Unix file permissions:
      # a folder limarepdf-<version>-<platform> holding the binaries, the docs and the licences
      # (packaging/package-archive.sh, which the Arch package built from source uses too).
      - name: Package
        shell: bash
        run: |
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          name="limarepdf-$version-${{ matrix.name }}"
          bash packaging/package-archive.sh "dist/$name"
          # Every file it should hold there, every link in its docs working, and the programs
          # built for this target.
          py=python3; [ "${{ runner.os }}" = "Windows" ] && py=python
          $py packaging/check-package.py --target "${{ matrix.target }}" "dist/$name"
          cd dist
          if [ "${{ runner.os }}" = "Windows" ]; then
            7z a -tzip "$name.zip" "$name" > /dev/null
          else
            tar -czf "$name.tar.gz" "$name"
          fi
      # .deb and .rpm from the binaries just built, with the crates' licences from the Package step;
      # the settings are in crates/limarepdf-gui/Cargo.toml.
      # The rpm is signed later, in the release job, which holds the key.
      - name: Linux packages
        if: runner.os == 'Linux'
        run: |
          cargo install cargo-deb cargo-generate-rpm --locked
          bash packaging/package-docs.sh
          cargo deb -p limarepdf-gui --no-build --no-strip --output dist/
          cargo generate-rpm -p crates/limarepdf-gui --output dist/
      # Each package's files as installed, and the glibc it asks for: the rpm names it by hand
      # (Cargo.toml), so it must match what the binaries use; the deb's is worked out by cargo-deb.
      # A mismatch means the floor moved: releasing.md says what to change, not only the rpm.
      - name: Check the Linux packages
        if: runner.os == 'Linux'
        run: |
          sudo apt-get install -y rpm > /dev/null
          dpkg-deb -c dist/*.deb
          rpm -qlp dist/*.rpm
          mkdir -p "$RUNNER_TEMP/deb" "$RUNNER_TEMP/rpm"
          dpkg-deb -x dist/*.deb "$RUNNER_TEMP/deb"
          python3 packaging/check-package.py --target "${{ matrix.target }}" "$RUNNER_TEMP/deb"
          rpm2cpio "$PWD"/dist/*.rpm | (cd "$RUNNER_TEMP/rpm" && cpio -idm --quiet)
          python3 packaging/check-package.py --target "${{ matrix.target }}" "$RUNNER_TEMP/rpm"
          need=$(objdump -T target/release/limarepdf target/release/limarepdf-cli \
            | grep -o 'GLIBC_[0-9][0-9.]*' | sort -uV | tail -1)
          asked=$(rpm -qp --requires dist/*.rpm | sed -n 's/^libc\.so\.6(\(GLIBC_[0-9.]*\))(64bit).*/\1/p')
          echo "The binaries need $need; the rpm asks for $asked; the deb: $(dpkg-deb -f dist/*.deb Depends | grep -o 'libc6 ([^)]*)')"
          if [ "$need" != "$asked" ]; then
            echo "::error::The binaries need $need, the rpm asks for $asked: see releasing.md's Linux packages"; exit 1
          fi
      # The AppImage from the archive just made (packaging/linux/make-appimage.sh), its runtime and
      # appimagetool at set versions; appimagetool checks the desktop entry with desktop-file-validate.
      # Then checked here, through FUSE (fuse3), as packaging/linux/check-appimage.sh says.
      - name: AppImage
        if: runner.os == 'Linux'
        run: |
          sudo apt-get install -y desktop-file-utils fuse3 > /dev/null
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          bash packaging/linux/make-appimage.sh "dist/limarepdf-$version-${{ matrix.name }}.tar.gz" dist
          bash packaging/linux/check-appimage.sh dist/*.AppImage "${{ matrix.target }}"
      # The MSI from packaging/windows/limarepdf.wxs, with the crates' licences from the Package step.
      # WiX is pinned to 5 (open source, no EULA step).
      # Two later versions of it, for the upgrade checks below, go to the runner's temporary folder;
      # on Arm, an x64 one of the same version too.
      - name: Windows installer
        if: runner.os == 'Windows'
        shell: bash
        run: |
          dotnet tool install --global wix --version 5.0.2
          export PATH="$PATH:$HOME/.dotnet/tools"
          wix extension add --global WixToolset.UI.wixext/5.0.2
          bash packaging/package-docs.sh
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          name="${{ matrix.name }}"
          arch=x64; [ "${{ runner.arch }}" = ARM64 ] && arch=arm64
          build() {
            wix build packaging/windows/limarepdf.wxs -arch "$1" -ext WixToolset.UI.wixext \
              -loc packaging/windows/limarepdf.wxl -culture en-US -d Version="$2" -o "$3"
          }
          build "$arch" "$version" "dist/limarepdf-$version-${name#windows-}.msi"
          build "$arch" 255.0.0 "$RUNNER_TEMP/upgrade-1.msi"
          build "$arch" 255.0.1 "$RUNNER_TEMP/upgrade-2.msi"
          if [ "$arch" = arm64 ]; then
            build x64 "$version" "$RUNNER_TEMP/same-version-x64.msi"
          fi
      # Installs the MSI without its screens, as a silent install would: the files and Start menu
      # shortcut, and the desktop shortcut option left out, asked for, kept by an upgrade and turned
      # off by one; then uninstalls. On Arm, which runs x64 programs too, an x64 LimarePDF of the
      # same version is replaced by the Arm64 one, not kept beside it. The screens themselves are
      # checked by hand (docs/developer/testing.md).
      - name: Check the Windows installer
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $msi = (Get-Item dist\*.msi).FullName
          $folder = "$env:ProgramFiles\LimarePDF"
          $menu = "$env:ProgramData\Microsoft\Windows\Start Menu\Programs\LimarePDF.lnk"
          $desktop = "$env:PUBLIC\Desktop\LimarePDF.lnk"
          $log = "$env:RUNNER_TEMP\msiexec.log"
          $uninstall = 'HKLM:\Software\Microsoft\Windows\CurrentVersion\Uninstall\*'
          function Run($what) {
            Write-Output "msiexec $what"
            $p = Start-Process msiexec -ArgumentList "$what /qn /l*v `"$log`"" -Wait -PassThru
            if ($p.ExitCode -notin 0, 3010) {
              Get-Content $log -Tail 80
              throw "msiexec $what ended with $($p.ExitCode)"
            }
          }
          function Expect($path, $there) {
            if ((Test-Path $path) -ne $there) { throw "$path is $(if ($there) { 'missing' } else { 'still there' })" }
          }
          function Installed($count) {
            $found = @(Get-ItemProperty $uninstall -ErrorAction SilentlyContinue | Where-Object DisplayName -eq 'LimarePDF')
            if ($found.Count -ne $count) { throw "$($found.Count) LimarePDF installed, not $count" }
          }
          Run "/i `"$msi`""
          Expect "$folder\limarepdf.exe" $true; Expect $menu $true; Expect $desktop $false
          python packaging\check-package.py --target "${{ matrix.target }}" $folder
          if ($LASTEXITCODE -ne 0) { throw "The installed folder has problems" }
          # Its icon and name, which a failed resource compile leaves out with only a build warning.
          $about = (Get-Item "$folder\limarepdf.exe").VersionInfo.FileDescription
          if ($about -ne 'LimarePDF') { throw "limarepdf.exe has no icon and name (FileDescription: '$about')" }
          Run "/x `"$msi`""
          Expect $folder $false; Expect $menu $false
          Run "/i `"$msi`" DESKTOPSHORTCUT=1"
          Expect $desktop $true
          Run "/i `"$env:RUNNER_TEMP\upgrade-1.msi`""
          Expect $desktop $true
          Run "/i `"$env:RUNNER_TEMP\upgrade-2.msi`" DESKTOPSHORTCUT=0"
          Expect $desktop $false; Expect $menu $true
          Run "/x `"$env:RUNNER_TEMP\upgrade-2.msi`""
          Expect $folder $false; Expect $menu $false; Expect $desktop $false
          Installed 0
          if ($env:RUNNER_ARCH -eq 'ARM64') {
            Run "/i `"$env:RUNNER_TEMP\same-version-x64.msi`""
            Installed 1
            Run "/i `"$msi`""
            Installed 1
            Run "/x `"$msi`""
            Installed 0; Expect $folder $false; Expect $menu $false
          }
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: limarepdf-${{ matrix.name }}
          path: |
            dist/*.tar.gz
            dist/*.zip
            dist/*.deb
            dist/*.rpm
            dist/*.AppImage
            dist/*.msi

  # A universal LimarePDF.app (Apple Silicon and Intel) in a .dmg; packaging/macos/make-dmg.sh.
  # The tests ran in the build job on both Macs.
  macos-dmg:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          toolchain: stable
          targets: aarch64-apple-darwin, x86_64-apple-darwin
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: Build
        run: cargo build --workspace --release --locked --target aarch64-apple-darwin --target x86_64-apple-darwin
      # As in the build job: no test seam in the programs released.
      - name: No test seam
        run: |
          for bin in target/*-apple-darwin/release/limarepdf target/*-apple-darwin/release/limarepdf-cli; do
            if grep -q LIMAREPDF_TEST_SYNC_FAILS "$bin"; then
              echo "::error::$bin was built with the test seam"; exit 1
            fi
          done
      # As in the build job, for the crates' licences, both Macs' in one page.
      - name: Install cargo-about
        run: cargo install cargo-about --locked --version 0.9.3 --features cli
      - name: Make the dmg
        run: bash packaging/macos/make-dmg.sh dist
      # The app as it comes out of the dmg: its files and their links, the crates of both kinds of
      # Mac in its licences, and macOS 11 as the oldest system for both.
      - name: Check the dmg
        run: |
          hdiutil attach -nobrowse -readonly -mountpoint "$RUNNER_TEMP/dmg" dist/*.dmg
          app="$RUNNER_TEMP/dmg/LimarePDF.app"
          find "$app" -type f
          python3 packaging/check-package.py --target aarch64-apple-darwin --target x86_64-apple-darwin "$app/Contents"
          for bin in limarepdf limarepdf-cli; do
            for arch in arm64 x86_64; do
              minos=$(otool -arch $arch -l "$app/Contents/MacOS/$bin" | awk '/minos/ {print $2; exit}')
              echo "$bin ($arch): macOS $minos or later"
              [ "$minos" = "11.0" ] || exit 1
            done
          done
          hdiutil detach "$RUNNER_TEMP/dmg"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: limarepdf-macos-dmg
          path: dist/*.dmg

  # The .deb and .rpm installed, each in a clean container, on the oldest systems docs/install.md
  # names and a current Fedora, then removed, and the AppImage run there on the libraries the
  # package brought: packaging/check-linux-install.sh. Both architectures', each on a runner of
  # its own. A release waits for it, so packages these systems refuse never ship.
  linux-install:
    needs: build
    strategy:
      fail-fast: false
      matrix:
        arch: [x86_64, arm64]
        image:
          - docker.io/library/ubuntu:24.04
          - docker.io/library/debian:13
          - docker.io/library/fedora:latest
          - docker.io/library/almalinux:10
          - registry.opensuse.org/opensuse/leap:16.0
    runs-on: ${{ matrix.arch == 'arm64' && 'ubuntu-24.04-arm' || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: limarepdf-linux-${{ matrix.arch }}
          path: dist
      - name: Install, load and remove
        env:
          IMAGE: ${{ matrix.image }}
        run: docker run --rm -v "$PWD:/w:ro" -w /w "$IMAGE" bash packaging/check-linux-install.sh dist

  # The release's source archive (git archive), and from it the AUR's limarepdf built as an Arch
  # Linux user's makepkg builds it, while the other platforms build: packaging/arch/check-arch.sh's
  # first run. Both go in the release, and the package to the arch job's checks.
  arch-source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Source archive
        run: |
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          mkdir dist
          git archive --prefix="limarepdf-$version/" HEAD | gzip -n > "dist/limarepdf-$version-source.tar.gz"
      - name: Build limarepdf
        run: |
          docker run --rm -v "$PWD:/w:ro" -v "$PWD/dist:/dist" -w /w docker.io/library/archlinux:base-devel \
            bash packaging/arch/check-arch.sh source /dist
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: limarepdf-source
          path: dist/*-source.tar.gz
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: limarepdf-arch
          path: dist/*.pkg.tar.zst

  # The AUR's limarepdf-bin built from the Linux archives for both architectures, and both packages
  # checked, then installed, upgraded, replaced and removed on x86_64, the programs at work after each
  # step: check-arch.sh's second run. A release waits for it, so the AUR's PKGBUILDs are known to
  # build from its files before they are made.
  arch:
    needs: [build, arch-source]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: limarepdf-linux-*
          path: dist
          merge-multiple: true
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: limarepdf-source
          path: dist
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: limarepdf-arch
          path: dist
      - name: Build, check, install and remove
        run: docker run --rm -v "$PWD:/w:ro" -w /w docker.io/library/archlinux:base-devel bash packaging/arch/check-arch.sh dist

  # The winget and Scoop manifests written from the MSIs and zips as for a release, with msitools reading
  # the MSIs' codes (packaging/windows/update.sh), then checked by winget-scoop-check.
  winget-scoop:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: limarepdf-windows-*
          path: dist
          merge-multiple: true
      - name: Write the manifests
        run: |
          sudo apt-get install -y msitools > /dev/null
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          bash packaging/windows/update.sh "$version" manifests dist
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: winget-scoop
          path: manifests

  # On Windows x64 and Arm64, with the files served on the runner in place of the release: winget
  # validates its manifests, installs LimarePDF from them and removes it, then Scoop does the same
  # (packaging/windows/check-manifests.ps1). A release waits for it.
  winget-scoop-check:
    needs: [build, winget-scoop]
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, windows-11-arm]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: limarepdf-windows-*
          path: dist
          merge-multiple: true
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: winget-scoop
          path: manifests
      - name: Install from the manifests, and remove
        shell: pwsh
        run: packaging/windows/check-manifests.ps1 manifests dist

  # On a version tag (v0.3.0): a draft GitHub Release with the archives, their checksums,
  # GPG signatures, build attestations and this version's section of CHANGELOG.md.
  # Publish it on GitHub. The release key is only in the release-signing environment, so the
  # job waits for the maintainer's approval. The tag's own checks come first, so a wrong tag
  # stops before anything is signed or attested. It waits for the deny job, so it never
  # starts after a known advisory.
  release:
    needs: [deny, build, macos-dmg, linux-install, arch, winget-scoop-check]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    environment: release-signing
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # All tags, to find the previous release for the compare link.
          fetch-depth: 0
      # The tag must match Cargo.toml and have a section in CHANGELOG.md, which is the notes.
      - name: Release notes
        run: |
          tag="$GITHUB_REF_NAME"
          version="${tag#v}"
          if ! grep -q "^version = \"$version\"" Cargo.toml; then
            echo "Tag $tag does not match the version in Cargo.toml"; exit 1
          fi
          awk -v v="[$version]" '/^## /{p = index($0, v) > 0; next} p' CHANGELOG.md > notes.md
          if [ ! -s notes.md ]; then
            echo "CHANGELOG.md has no section for $version"; exit 1
          fi
          # Relative links do not work on the release page: point them at this tag.
          sed -i "s#](docs/#](https://github.com/$GITHUB_REPOSITORY/blob/$tag/docs/#g" notes.md
          # Link every commit since the previous version tag, if there is one.
          prev=$(git tag --list 'v*' --sort=-v:refname | awk -v t="$tag" 'f {print; exit} $0 == t {f = 1}')
          if [ -n "$prev" ]; then
            printf '\n**All changes:** https://github.com/%s/compare/%s...%s\n' \
              "$GITHUB_REPOSITORY" "$prev" "$tag" >> notes.md
          fi
      # The release's files: the artifacts named limarepdf-*.
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: limarepdf-*
          path: assets
          merge-multiple: true
      # The rpm's own signature, SHA256SUMS, and a detached signature (.asc) for it and for every
      # file, made with the signing subkey and checked against the published key in docs/.
      - name: Checksums and signatures
        env:
          GPG_SIGNING_KEY: ${{ secrets.GPG_SIGNING_KEY }}
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
        run: |
          bash packaging/import-signing-key.sh docs/limarepdf-signing-key.asc
          sudo apt-get install -y rpm > /dev/null
          bash packaging/sign-release.sh assets docs/limarepdf-signing-key.asc
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: assets/*
      - name: Draft the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" --draft --verify-tag --title "LimarePDF ${GITHUB_REF_NAME#v}" \
            --notes-file notes.md assets/*

  # Started by hand with "dry_run" ticked: everything the release job does but signing, attesting
  # and publishing, with no secrets and no approval. The signing is rehearsed on a copy of the files
  # with a key made for this run alone (packaging/sign-release.sh, as at a tag), and the
  # published key must still be able to sign for 60 days. The files themselves get SHA256SUMS
  # only and are uploaded as release-dry-run-unsigned. Like a release, it waits for the deny job.
  dry-run:
    needs: [deny, build, macos-dmg, linux-install, arch, winget-scoop-check]
    if: inputs.dry_run && !startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: limarepdf-*
          path: assets
          merge-multiple: true
      - name: The release key's expiry
        run: bash packaging/check-signing-key.sh docs/limarepdf-signing-key.asc 60
      - name: Signing rehearsed (a throwaway key)
        run: |
          sudo apt-get install -y rpm > /dev/null
          export GNUPGHOME="$RUNNER_TEMP/rehearsal-key"
          mkdir -m 700 "$GNUPGHOME"
          gpg --batch --passphrase '' --quick-gen-key "LimarePDF rehearsal <rehearsal@invalid>" ed25519 sign 1d
          gpg --armor --export > "$RUNNER_TEMP/rehearsal.asc"
          # Imported as a tag imports the release key.
          GPG_SIGNING_KEY=$(gpg --armor --export-secret-keys)
          export GPG_SIGNING_KEY GNUPGHOME="$RUNNER_TEMP/rehearsal-gnupg"
          mkdir -m 700 "$GNUPGHOME"
          bash packaging/import-signing-key.sh "$RUNNER_TEMP/rehearsal.asc"
          cp -r assets "$RUNNER_TEMP/rehearsal"
          bash packaging/sign-release.sh "$RUNNER_TEMP/rehearsal" "$RUNNER_TEMP/rehearsal.asc"
      - name: Checksums (unsigned)
        run: |
          cd assets
          sha256sum * > SHA256SUMS
          note="Unsigned dry run: the files have checksums only, with no GPG or rpm signatures and no attestations. Signing was rehearsed on a copy with a throwaway key; only a version tag's release job, approved in the release-signing environment, signs with the release key."
          echo "::notice::$note"
          echo "$note" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-dry-run-unsigned
          path: assets
