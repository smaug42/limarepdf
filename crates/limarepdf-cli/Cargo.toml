[package]
name = "limarepdf-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
# The integration tests are one test program, `tests/all.rs`, with the other files in `tests/`
# its modules: one program builds and links far faster than one a file. A test file not in it
# never runs (tools/check-test-programs.py, in CI's lint job, fails then).
autotests = false

[[bin]]
name = "limarepdf-cli"
path = "src/main.rs"

[[test]]
name = "all"
path = "tests/all.rs"

[dependencies]
limarepdf-core = { path = "../limarepdf-core" }
anyhow.workspace = true
clap.workspace = true
rayon.workspace = true
serde_json.workspace = true
# Asking for digital ID passwords without showing them; wiping them after use.
rpassword = "7.5.4"
zeroize = "1.9"

[dev-dependencies]
# Tests only: a folder sync that fails, for "saved, not confirmed" (REL-10). The program the
# tests run is built with it; a release build isn't.
limarepdf-core = { path = "../limarepdf-core", features = ["test-seams"] }
