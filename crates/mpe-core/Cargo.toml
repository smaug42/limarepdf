[package]
name = "mpe-core"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
lopdf.workspace = true
hayro.workspace = true
anyhow.workspace = true
thiserror.workspace = true
rayon.workspace = true
rand.workspace = true
image.workspace = true
tiff.workspace = true
fax = "0.2"
png = "0.18"
# Glyph outlines for typed signatures; hayro already uses it to draw fonts.
skrifa = "0.46"
ocrs = { version = "0.13", default-features = false, features = ["rten"] }
rten = { version = "0.26", default-features = false, features = ["rten_format"] }
rten-imageproc = "0.26"

# Digital signatures (docs/signatures.md lists these crates and their release status).
# `rsa` and `pkcs1` are pre-releases, pinned exactly.
chrono = { version = "0.4", default-features = false, features = ["std", "clock"] }
der = { version = "0.8.2", features = ["alloc", "oid"] }
spki = "0.8.1"
x509-cert = { version = "0.3.0", default-features = false, features = ["std"] }
rsa = "=0.10.0-rc.19"
pkcs1 = { version = "=0.8.0-rc.5", default-features = false }
p256 = { version = "0.14.0", features = ["ecdsa"] }
p384 = { version = "0.14.0", features = ["ecdsa"] }
sha1 = { version = "0.11.0", features = ["oid"] }
sha2 = { version = "0.11.0", features = ["oid"] }

[dev-dependencies]
# Signing test documents with the OpenSSL-made keys in tests/data/signatures/keys.
getrandom = { version = "0.4", features = ["sys_rng"] }
p256 = { version = "0.14.0", features = ["ecdsa", "pkcs8"] }
p384 = { version = "0.14.0", features = ["ecdsa", "pkcs8"] }

# Printing through the Windows print spooler and GDI (system DLLs; no C code is built).
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_Graphics_Printing",
    "Win32_Storage_Xps",
] }
